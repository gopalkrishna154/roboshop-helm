apiVersion: apps/v1

kind: Deployment

metadata:
  name: catalogue
  namespace: roboshop

  # labels related to deployment resources
  labels:
    project: roboshop
    tier: backend
    component: catalogue

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catalogue

  # pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catalogue

    spec:
      containers:
        - name: catalogue
          image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deploymet.imageVersion }}"
          resources: 
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              requests:
              cpu: "100m"
              memory: "128Mi"
          envFrom:
          -  configMapRef:
                name: catalogue